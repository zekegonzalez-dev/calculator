<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Basic Calculator</title>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display">16</div>
            <div class="buttons">
                <button class="orange">C</button>
                <button class="orange">AC</button>
                <button class="orange">&percnt;</button>
                <button class="orange" >+/-</button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="orange">&divide;</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="orange">&times;</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="orange">-</button>
                <button>0</button>
                <button class="orange">&middot;</button>
                <button class="orange">+</button>
                <button class="orange">=</button>
            </div>
        </div>
    </div>
</body>
</html>
